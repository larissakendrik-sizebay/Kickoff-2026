ns', Helvetica, Arial, sans-serif" font-size="24" fill="#2340E0" text-anchor="start" font-weight="700" letter-spacing="3">FAÇA</text><text x="1240" y="375.0" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Fundo creme com recortes saindo das bordas</text><text x="1240" y="409.8" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Pessoas em recorte, olhando para cima</text><text x="1240" y="444.6" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Lockup sobreposto às fotos, nunca isolado</text><text x="1240" y="479.4" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Lema em tira de papel com marca-texto amarelo</text><text x="1240" y="610" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#F2452B" text-anchor="start" font-weight="700" letter-spacing="3">EVITE</text><text x="1240" y="655.0" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Gradientes, sombras e efeitos 3D</text><text x="1240" y="689.8" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Bordas retas e perfeitas nos recortes</text><text x="1240" y="724.6" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Texto longo sobre amarelo ou rosa em fonte fina</text><text x="1240" y="759.4" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Mais de 3 cores fortes no mesmo bloco</text><g id="explosao"><line x1="1794.0" y1="960.0" x2="1861.1" y2="960.0" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1793.1" y1="964.9" x2="1862.9" y2="991.1" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1790.1" y1="969.7" x2=
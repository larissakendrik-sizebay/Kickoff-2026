Sans', Helvetica, Arial, sans-serif" font-size="22" fill="#111111" text-anchor="start" font-weight="700">3  “we” serifado no vermelho</text><circle cx="700" cy="752" r="6" fill="#F2452B"/><text x="720" y="760" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="22" fill="#111111" text-anchor="start" font-weight="700">4  FIT no amarelo</text><text x="1240" y="330" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#2340E0" text-anchor="start" font-weight="700" letter-spacing="3">FAÇA</text><text x="1240" y="375.0" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Fundo creme com recortes saindo das bordas</text><text x="1240" y="409.8" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Pessoas em recorte, olhando para cima</text><text x="1240" y="444.6" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Lockup sobreposto às fotos, nunca isolado</text><text x="1240" y="479.4" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Lema em tira de papel com marca-texto amarelo</text><text x="1240" y="514.2" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Bordas rasgadas com a fibra branca do papel</text><text x="1240" y="650" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#F2452B" text-anchor="start" font-weight="700" letter-spacing="3">EVITE</text><text x="1240" y="695.0" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Gradientes, sombras e efeitos 3D</text><text x="1240" y="729.8" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Bordas retas e perfeitas nos recortes</text><text x="1240" y="764.6" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Texto longo sobre amarelo ou rosa em fonte fina</text><text x="1240" y="799.4" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="start">• Mais de 3 cores fortes no mesmo bloco</text><g id="explosao"><line x1="1794.0" y1="959.7" x2="1857.0" y2="958.5" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1793.1" y1="964.9" x2="1862.2" y2="990.6" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1789.5" y1="970.3" x2="1838.7" y2="1023.3" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1785.5" y1="972.9" x2="1810.8" y2="1032.5" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1780.5" y1="974.0" x2="1782.8" y2="1040.5" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1774.5" y1="972.9" x2="1745.6" y2="1040.6" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1770.0" y1="969.8" x2="1721.0" y2="1017.7" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1767.3" y1="965.8" x2="1709.7" y2="992.0" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1766.0" y1="959.8" x2="1698.4" y2="959.0" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1767.2" y1="954.3" x2="1704.1" y2="925.9" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1770.0" y1="950.2" x2="1718.0" y2="899.2" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1774.6" y1="947.1" x2="1748.0" y2="883.2" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1779.5" y1="946.0" x2="1777.3" y2="876.2" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1785.7" y1="947.2" x2="1813.0" y2="886.6" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1790.3" y1="950.5" x2="1844.9" y2="900.1" stroke="#111111" stroke-width="3" stroke-linecap="round"/><line x1="1792.9" 
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F4EFE4"/><text x="80" y="70" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" text-anchor="start" font-weight="700" letter-spacing="2">KICKOFF 2026 · KEY VISUAL</text><text x="1840" y="70" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" text-anchor="end" font-weight="700">02 / 11</text><text x="80" y="170" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="22" fill="#2340E0" text-anchor="start" font-weight="700" letter-spacing="3">CONCEITO</text><text x="80" y="250" font-family="'Archivo Black', 'Arial Black', sans-serif" font-size="72" fill="#111111" text-anchor="start">Together we fit</text><text x="80" y="340.0" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="30" fill="#5A5650" text-anchor="start">Sozinhos, a gente já encaixa bem. Juntos, o encaixe fica perfeito.</text><text x="80" y="383.5" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="30" fill="#5A5650" text-anchor="start"></text><text x="80" y="427.0" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="30" fill="#5A5650" text-anchor="start">Assim como a Sizebay encontra o caimento certo para cada pessoa,</text><text x="80" y="470.5" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="30" fill="#5A5650" text-anchor="start">cada time encontra o seu lugar quando trabalha junto. A identidade</text><text x="80" y="514.0" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="30" fill="#5A5650" text-anchor="start">do Kickoff 2026 traduz essa ideia em colagem: peças diferentes —</text><text x="80" y="557.5" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="30" fill="#5A5650" text-anchor="start">cores, recortes, texturas e pessoas — que só fazem sentido juntas.</text><text x="80" y="720" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="20" fill="#2340E0" text-anchor="start" font-weight="700" letter-spacing="3">PALAVRAS-CHAVE</text><g transform="translate(80 750) rotate(-2)"><polygon points="0.0,0.0 16.4,-1.5 32.9,0.0 49.3,0.0 65.7,1.4 82.1,-1.6 98.6,-1.1 115.0,0.4 131.4,0.2 147.9,1.1 164.3,0.2 180.7,0.9 197.1,1.1 213.6,1.0 230.0,0.0 229.8,17.5 230.6,35.0 229.7,52.5 230.0,70.0 213.6,71.6 197.1,68.7 180.7,70.2 164.3,68.7 147.9,69.3 131.4,69.3 115.0,71.2 98.6,71.0 82.1,68.1 65.7,68.3 49.3,68.8 32.9,68.0 16.4,69.9 0.0,70.0 -1.0,52.5 -0.4,35.0 0.1,17.5" fill="#2340E0"/><text x="115" y="46" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="28" fill="#F4EFE4" text-anchor="middle" font-weight="700">Coletivo</text></g><g transform="translate(330 750) rotate(2)"><polygon points="0.0,0.0 16.4,-0.8 32.9,-0.2 49.3,1.5 65.7,0.8 82.1,0.3 98.6,-1.9 115.0,0.8 131.4,-0.5 147.9,-0.3 164.3,-0.4 180.7,0.3 197.1,-0.0 213.6,-1.5 230.0,0.0 230.0,17.5 229.4,35.0 229.8,52.5 230.0,70.0 213.6,70.0 197.1,68.3 180.7,71.0 164.3,70.3 147.9,68.3 131.4,70.1 115.0,69.9 98.6,71.9 82.1,71.1 65.7,71.5 49.3,71.8 32.9,69.2 16.4,68.5 0.0,70.0 -1.0,52.5 0.3,35.0 -0.1,17.5" fill="#F2452B"/><text x="115" y="46" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="28" fill="#F4EFE4" text-anchor="middle" font-weight="700">Diversidade</text></g><g transform="translate(580 750) rotate(-2)"><polygon points="0.0,0.0 16.4,-0.1 32.9,-1.1 49.3,1.5 65.7,0.5 82.1,-0.2 98.6,-0.1 115.0,1.7 131.4,1.9 147.9,0.2 164.3,0.2 180.7,0.7 197.1,-0.8 213.6,1.2 230.0,0.0 230.0,17.5 230.1,35.0 229.1,52.5 230.0,70.0 213.6,70.3 197.1,70.8 180.7,70.9 164.3,71.9 147.9,69.4 131.4,69.6 115.0,70.2 98.6,69.9 82.1,70.0 65.7,68.3 49.3,71.0 32.9,70.1 16.4,70.0 0.0,70.0 0.8,52.5 0.7,35.0 0.1,17.5" fill="#E4EC2C"/><text x="115" y="46" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="28" fill="#111111" text-anchor="middle" font-weight="700">Encaixe</text></g><g transform="translate(830 750) rotate(2)"><pol
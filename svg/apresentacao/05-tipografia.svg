<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FDEDD8"/><text x="80" y="70" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#050505" text-anchor="start" font-weight="700" letter-spacing="2">KICKOFF 2026 · KEY VISUAL</text><text x="1840" y="70" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#050505" text-anchor="end" font-weight="700">05 / 11</text><text x="80" y="170" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="22" fill="#0017C8" text-anchor="start" font-weight="700" letter-spacing="3">FONTES</text><text x="80" y="250" font-family="'Archivo Black', 'Arial Black', sans-serif" font-size="72" fill="#050505" text-anchor="start">Tipografia</text><text x="80" y="420" font-family="'Archivo Black', 'Arial Black', sans-serif" font-size="130" fill="#050505" text-anchor="start">Aa</text><text x="330" y="340" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#0017C8" text-anchor="start" font-weight="700">Archivo Black — Display / Títulos</text><text x="330" y="420" font-family="'Archivo Black', 'Arial Black', sans-serif" font-size="64" fill="#050505" text-anchor="start">TOGETHER WE FIT</text><text x="330" y="470" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="22" fill="#5A5650" text-anchor="start">Caixa alta em títulos de apoio. O lockup é lettering exclusivo (arquivo vetorizado).</text><line x1="80" y1="515" x2="1840" y2="515" stroke="#00000022" stroke-width="2"/><text x="80" y="660" font-family="'DM Serif Display', Georgia, serif" font-size="130" fill="#050505" text-anchor="start" font-style="italic">Aa</text><text x="330" y="580" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#0017C8" text-anchor="start" font-weight="700">DM Serif Display Italic — Destaque</text><text x="330" y="660" font-family="'DM Serif Display', Georgia, serif" font-size="64" fill="#050505" text-anchor="start" font-style="italic">we</text><text x="330" y="710" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="22" fill="#5A5650" text-anchor="start">Só para palavras de destaque, como o “we”. Nunca em textos longos.</text><line x1="80" y1="755" x2="1840" y2="755" stroke="#00000022" stroke-width="2"/><text x="80" y="900" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="130" fill="#050505" text-anchor="start">Aa</text><text x="330" y="820" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="24" fill="#0017C8" text-anchor="start" font-weight="700">DM Sans Regular &amp; Bold — Apoio / Textos</text><text x="330" y="900" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="44" fill="#050505" text-anchor="start">Alone we fit well. Together, we fit perfectly.</text><text x="330" y="950" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="22" fill="#5A5650" text-anchor="start">Textos corridos, legendas, crachás e sinalização.</text><line x1="80" y1="995" x2="1840" y2="995" stroke="#00000022" stroke-width="2"/><text x="1840" y="1030" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="20" fill="#5A5650" text-anchor="end">Todas gratuitas no Google Fonts e disponíveis no Figma.</text></svg>
